// ============================================================================
// perf_nextbot.cfg   —— 缓解"尸潮期间掉 TICK"
// ----------------------------------------------------------------------------
// 适用：64 tick 服务器，配合 l4d2_auto_add_zombie 使用（可热加载，无需重启）
//
// 【问题定性】
//   现象：触发地图机制（警报刷尸潮）时掉 TICK，尸潮一停就立刻恢复。
//   ⭐ "停下来就立刻恢复"是关键证据：说明主因不是"一次性生成的尖峰成本"
//      （那种 1~2 秒就恢复了），而是**尸潮期间持续存在的高 AI 负载**。
//
//   公式： 每 tick CPU 成本 ≈ alive（同时存活数） × 每只僵尸的 AI 成本
//          尸潮期间两个乘数一起涨 ⇒ 成本约 ×4 ⇒ 掉 TICK
//            · alive     平时 ~60 → 尸潮期 ~120~140（警报能突破常规上限）
//            · 每只成本   全部进入"锁定玩家"状态，寻路 + 感知 + 选目标全开
//          ⇒ 尸潮一停，两个乘数同时回落 ⇒ 立刻恢复。与现象完全吻合。
//
// 【三个参数】
//   NextBots = 普通小僵尸 + 特感 + Witch + 幸存者 bot（一切非玩家 AI）
//
//   ① nb_update_frequency   【单位 = 秒】AI 更新的人工延迟间隔
//         0 = 每 tick | 0.0226 ≈ 44 次/秒 | 0.1 = 10 次/秒 | 0.2 = 5 次/秒
//         ⚠️ 官方默认 = 0；社区口口相传的"默认 0.1"是误传。
//         ⚠️ 不影响僵尸数量 / 生成 / 补充速度，只管"脑子转多快"。
//
//   ② nb_update_framelimit  【只/帧】每帧最多处理几只 NextBot 的 AI（默认 15）
//         ⭐ 本文件的核心"限流阀"：它把"每帧成本"和"僵尸总数"解耦。
//            降它 = 不管场上有 60 只还是 200 只，每帧只算 N 只。
//
//   ③ nb_update_maxslide    【拍】被推迟几拍后**强制**更新（默认 2）
//         ⭐ 越高 = 越允许排队等待 = 越少"强制插队" = **CPU 越低**
//         ⚠️ 方向容易搞反：竞技配置用小 maxslide 配极低 frequency，
//            那是为了"极限灵敏、舍得烧 CPU"。目标是省 CPU 就要**调高**。
// ============================================================================


// ---- 档位 A（建议先试）：稳健 ----
// 思路：频率小幅放松 + 加强每帧限流 + 允许排队，手感损失很小。
sm_cvar nb_update_frequency 0.125   // 10 次/秒 → 8 次/秒
sm_cvar nb_update_framelimit 8      // 每帧 15 → 8 只（限流 -47%）★核心
sm_cvar nb_update_maxslide 3        // 允许排队 3 拍（默认 2）★越高越省
// 预期：尸潮期 TICK 明显改善；手感基本无感；僵尸数量完全不变。


// ---- 档位 B（加强）：A 档仍掉 TICK 时换这档 ----
// 代价：远处僵尸会明显迟钝一点，但近身战感知仍然正常。
// 换档方法：注释掉上面 A 档三行，取消下面三行注释，再 exec。
//sm_cvar nb_update_frequency 0.15    // 6.7 次/秒
//sm_cvar nb_update_framelimit 5      // 每帧只算 5 只 ★强限流
//sm_cvar nb_update_maxslide 5        // 允许排队 5 拍


// ---- 档位 C（极限）：仅当 B 档仍不够，且能接受僵尸"发愣" ----
//sm_cvar nb_update_frequency 0.2     // 5 次/秒
//sm_cvar nb_update_framelimit 3      // 每帧只算 3 只
//sm_cvar nb_update_maxslide 6

// ⚠️ frequency 不要超过 0.2 —— 超过后僵尸"见到玩家会犹豫半秒才动"肉眼可见。


// ============================================================================
// 【机制：引擎原生的"分批次生成"】
// ----------------------------------------------------------------------------
//  Valve 官方脚本文档原文：
//    "A Panic lasts until MegaMobSize commons spawn, and **no more than
//     CommonLimit will ever be out at once**. So MegaMobSize 50 CommonLimit 2
//     is a long slow gentle PANIC, and MegaMobSize 80 CommonLimit 80 is over
//     instantly, with a lot of zombies around."
//
//  ⇒ 引擎原生就支持"分批次"，倾泻速度 = MegaMobSize : CommonLimit 之比：
//       MegaMobSize = 这一次总共要放多少（总量）
//       CommonLimit = 同一时刻最多几只在场（决定快慢）
//  ⇒ 若 CommonLimit ≥ MegaMobSize ⇒ 尸潮瞬间全部倾泻 ⇒ TICK 尖峰。
//    想缓释就让尸潮期间的 CommonLimit 低一点：总量不变，摊到几秒里出来。
//    ⚠️ 反直觉但正确：**降 CommonLimit 会让尸潮更慢、tick 更稳**。
//    ⚠️ 注意插件的"尸潮脉动"方向相反（尸潮前把 cap 抬高），
//       那是为了让尸潮进得来。两者目标不同：脉动 = 保震撼；缓释 = 保 tick。
// ============================================================================


// ============================================================================
// 【诊断：怎么确认改对了】
//   换上 A 档后玩一局，触发一次警报尸潮：
//     ① TICK 不再掉  → 确认是 AI 持续成本，本文件就是正解。
//     ② TICK 还是掉  → 主因是生成尖峰（一次性创建 + 打包快照），需动数量。
//
//   取证：日志 <server>/left4dead2/l4d2_zombie_watch.log
//         搜 TICKWARN（记录当时的 tick 与 alive）
// ============================================================================


// ============================================================================
// 【兜底：如果 nb_* 压不住，说明要动数量】
//   降警报尸潮规模（改 cfg/sourcemod/l4d2_auto_add_zombie.cfg）：
//       l4d2_mega_mob_size      "40"  → 想减半就写 "20"
//       l4d2_mega_mob_size_min  "60"  → 硬下限，会把 base 夹回来！
//                                       想真降必须**同时**把它降到 20 或 0
//       l4d2_mega_mob_size_max  "100" → 同上，降到 60
//     ⚠️ 只改 base 不改 _min 是没用的 —— base 40 会被 _min 60 夹上去。
// ============================================================================


// ============================================================================
// 【关于 sv_parallel_* 】—— 别动
//   sv_parallel_packentities 0 / sv_parallel_sendsnapshot 0
//   是 Valve 官方承认的**防崩**措施（并行在掉帧时有线程锁 bug），保持 0。
//   ⚠️ 但它们也是"生成尖峰"的放大器：尸潮一次性创建 N 个实体时，
//      实体打包 + 快照发送全部挤在单核。
// ============================================================================


// ============================================================================
// 【用法】（可热加载，不用重启）
//   exec perf_nextbot.cfg       加载
//   exec perf_nextbot_off.cfg   恢复
//   开机自动生效：在 server.cfg 末尾加一行  exec perf_nextbot.cfg
//      ⚠️ 手动在控制台设的值重启会丢，必须靠这行固化。
// ============================================================================
