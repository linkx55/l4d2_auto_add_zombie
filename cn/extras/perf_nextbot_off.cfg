// ============================================================================
// perf_nextbot_off.cfg —— 把 nb_* 还原到默认值
// ----------------------------------------------------------------------------
// 用途：exec perf_nextbot.cfg 之后想反悔，敲这个恢复（无需重启）。
//
// ⚠️ nb_update_frequency 的引擎默认是 0，但运行时会被地图脚本动态改写，
//    所以这里统一回到 0.1 / 15 / 2（后者是 framelimit 与 maxslide 的官方默认）。
// ============================================================================

sm_cvar nb_update_frequency 0.1     // 10 次/秒
sm_cvar nb_update_framelimit 15     // 官方默认
sm_cvar nb_update_maxslide 2        // 官方默认

echo "=========================================="
echo " perf_nextbot 已卸载 -> nb_* = 0.1 / 15 / 2"
echo "=========================================="
