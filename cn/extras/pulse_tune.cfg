// ============================================================================
// pulse_tune.cfg —— 【尸潮脉动上限】空位按人数缩放 + 硬钳
// ----------------------------------------------------------------------------
// 用途：在不改主 cfg 的前提下，把脉动空位临时调成"按人数缩放"。
//       需要 v1.8.1 及以上的 smx（新增 l4d2_pulse_extra_step / _max）；
//       在旧 smx 上跑前几行会提示 "Unknown command"。
//
// 【为什么空位不能留 0】
//   空位写 0 = "自动模式" = max(尸潮上限, 警报上限)，高人数时这个值会很大。
//   例：尸潮上限 96、警报上限 60 ⇒ 空位 96 ⇒ 8 人时上限被抬到 128+96=224，
//   峰值容易冲过 220，单核直接掉 TICK。
//   ⇒ 改成按人数缩放：8 人只给 40 ⇒ 上限 168。
//
// 【用法】
//   ① 热加载（不用重启）：exec pulse_tune.cfg
//   ② 想永久生效：把下面几行贴进 cfg/sourcemod/l4d2_auto_add_zombie.cfg
//   ③ 撤销：把 _step 与 _max 改回 0（_step 0 = 空位固定不随人数变）
// ============================================================================

sm_cvar l4d2_pulse_extra 20          // 空位基础值：4 人及以下 = +20
sm_cvar l4d2_pulse_extra_step 5      // 每多 1 人 +5  ⇒ 8 人 = 20 + 4×5 = 40
sm_cvar l4d2_pulse_extra_max 40      // 空位硬上限：无论多少人都不超过 +40
sm_cvar l4d2_pulse_cap_max 180       // 脉动上限的绝对天花板（保 tick 最后一道闸）

echo "=========================================================="
echo " 脉动已调优: 空位 4人+20 / 8人+40 / 封顶+40, 上限钳 180"
echo " 8 人: 基础上限 128 + 40 = 168"
echo "=========================================================="


// ============================================================================
// 【结果对照】（基础上限取决于主 cfg 的 l4d2_common_limit 阶梯）
//   人数 | 基础上限 | 空位 | 脉动上限
//   -----+----------+------+----------
//    4   |    64    | +20  |    84
//    5   |    80    | +25  |   105
//    6   |    96    | +30  |   126
//    7   |   112    | +35  |   147
//    8   |   128    | +40  |   168
//    9   |   144    | +40* | 184 → 180
//   10   |   160    | +40* | 200 → 180
//   -----+----------+------+----------
//   * 被 l4d2_pulse_extra_max 40 封顶；9 人起被 cap_max 钳在 180
// ============================================================================


// ============================================================================
// 【如果 168 还是掉 TICK】按顺序收，一次只动一个：
//   sm_cvar l4d2_pulse_cap_max 150     全局压到 150
//   sm_cvar l4d2_pulse_extra_max 30    空位再收
//   sm_cvar l4d2_pulse_extra 15        基础空位再收
//   ⚠️ 不要再降回"自动模式"（l4d2_pulse_extra 0），那会给很大的空位。
//
// 【另一条互补的路】本文件降的是"同时存活数"（公式前一个乘数）；
//   perf_nextbot.cfg 降的是"每只僵尸的 AI 成本"（后一个乘数）。两者可叠加。
// ============================================================================
