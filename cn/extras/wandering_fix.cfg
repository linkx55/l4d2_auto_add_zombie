// ============================================================================
// wandering_fix.cfg —— 补回"决定地图空不空"的游荡僵尸参数
// ----------------------------------------------------------------------------
// 用途：把两个真正决定"地图上有没有闲逛小僵尸"的引擎 cvar 设到合理值。
//
// 【机制：为什么是这两个值】
//   抬 z_common_limit 不会增加僵尸 —— 引擎从来填不满它。
//   真正决定人口的是游荡僵尸系统：
//       z_wandering_density   游荡僵尸的密度系数。原版默认 0.03（几乎等于没有）。
//       z_background_limit    后台地图（玩家还没走到、不在视野内）的僵尸配额。
//                             原版默认 20。
//   ⚠️ 前提：server.cfg 必须有  sm_cvar director_always_allow_wanderers 1
//      没有它，游荡僵尸永远不会被允许生成，密度填多大都一样。
//   ⚠️ z_background_limit 越高 ⇒ 后台 AI 越多 ⇒ 越吃 CPU。
//      下面是"恢复到合理值"，不是"拉到最高"。先观察 tick 再决定要不要加。
//
// 【⚠️ 关于 z_spawn_range】
//   实测证明这个 cvar **写入无效**（内存里永远是 1500）。所以下面故意不写它 ——
//   写了也是假的，只会误导。想加视野距离请用 `z_acquire_far_range`（那个有效）。
//
// 【用法】热加载，不用重启：
//   exec wandering_fix.cfg      // 加载
//   exec wandering_fix_off.cfg  // 回到引擎默认
// ============================================================================


// ---- 方案 1（推荐）：温和恢复 ----
sm_cvar z_wandering_density 0.25    // 原版 0.03 → 0.25（约 ×8）
sm_cvar z_background_limit 240      // 原版 20 → 240（保守值，先确认 tick）
// 预期：空旷大地图应明显"到处都有僵尸"；tick 会上升（更多 AI），需观察 TICKWARN。


// ---- 方案 2（完整恢复）：后台容量也拉高 ----
// 适用：方案 1 的 tick 没问题、还想更多。400 只后台僵尸同时跑 AI 是实打实的负载。
//sm_cvar z_wandering_density 0.25
//sm_cvar z_background_limit 400


// ---- 方案 3（静态近似动态）：按 8 人折算 ----
// 本文件是静态 cfg，做不到按人数变。想按人数缩放请直接用插件的
// l4d2_wandering_density_step / l4d2_background_limit_step。
// 若只想用一个固定值覆盖常见人数（8 人），可用：
//sm_cvar z_wandering_density 0.41
//sm_cvar z_background_limit 360


// ============================================================================
// 【怎么判断生效了】
//   控制台：sm_cvar z_wandering_density   应回显 0.25（或你要的值）
//           sm_cvar z_background_limit    应回显 240
//   ⚠️ 若读回还是 0.03 / 20 ⇒ 说明有插件的 cfg 在覆盖它
//      （SourceMod 的 cfg 在 server.cfg 之后执行）。
//   游戏内：空旷图（广场 / 室外）应明显有"站在那儿发呆"的小僵尸。
// ============================================================================
