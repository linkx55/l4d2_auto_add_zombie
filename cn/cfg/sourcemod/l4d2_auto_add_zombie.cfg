// ============================================================================
//  l4d2_auto_add_zombie.cfg  ——  动态僵尸数量 / 硬性上下限 / 游荡密度 / 分布散布
//  重载插件：控制台执行    sm plugins reload l4d2_auto_add_zombie
//  v1.8.2   |   GNU GPL v3   |   基于「动态僵尸. v1.0.1」(原作者 Tom.) 二次开发
// ----------------------------------------------------------------------------
//  下面 8 项为原插件遗留，语义与默认值保持兼容，原版 cfg 可直接沿用：
//      ai_enabled_zombie / ai_playercount_zombie / l4d2_ai_auto_add_zombie /
//      l4d2_ai_max_zombie / l4d2_common_limit / l4d2_mega_mob_size /
//      l4d2_mob_spawn_min_size / l4d2_mob_spawn_max_size
//  其余 l4d2_* 项为本版新增。
// ----------------------------------------------------------------------------
//  ⚠️ 本文件在 server.cfg 之后执行，会覆盖 server.cfg 里的同名设置。
//     要让 server.cfg 接管某一项：把它的 _step 改成 0，基础值改成固定值即可。
//  ⚠️ 本文件由插件启动时自动执行（AutoExecConfig 注册名 = l4d2_auto_add_zombie）。
//     文件名必须与注册名一致，改名会导致这些数值完全不被加载。
//
//  通用计算规则（除总开关外，每个参数都是四段式）：
//      实算值 = base + （人数 - 起始人数）× step  →  clamp(实算值, _min, _max)
//      起始人数 = ai_playercount_zombie（默认 4）
//  ⚠️ 任何 _max 低于该参数的阶梯最高值 ⇒ 整条阶梯被静默夹平（最常见的调参事故）
// ============================================================================


// ----------------------------------------------------------------------------
//  一、总开关
// ----------------------------------------------------------------------------
plugin_enable "1"                   // 主开关：0 = 完全不碰任何引擎 cvar
plugin_hint "0"                     // 1 = 数值变化时聊天框提示，0 = 静默
ai_enabled_zombie "1"               // 0 = 所有参数固定不缩放，1 = 按人数动态
ai_playercount_zombie "4"           // 起始人数：超过这个人数才开始加成
l4d2_ai_count_bots "1"              // 1 = bot 计入人数，0 = 只算真人
l4d2_ai_apply_interval "1"          // 周期校正间隔（秒），0 = 关闭
l4d2_ai_force_trim "0"              // 1 = 超过硬上限就强删多余存活小僵尸（极端情况才开）
l4d2_ai_test_players "0"            // 调试：手动模拟人数，0 = 用真实人数

// 心跳日志：把战场数据定期写进 left4dead2/l4d2_zombie_watch.log（游戏根目录）
l4d2_ai_log_enable "1"              // 1 = 写日志，0 = 关闭（关闭后零开销）
l4d2_ai_log_interval "1.0"          // 心跳间隔（秒）；1.0 才看得清尸潮生成速度
l4d2_ai_tick_warn "55"              // 实测 tick 低于此值额外写一条 TICKWARN，0 = 关闭


// ----------------------------------------------------------------------------
//  二、【普通尸潮一次刷几只】 → z_mob_spawn_min_size / z_mob_spawn_max_size
// ----------------------------------------------------------------------------
//  一次灌入越多，单帧 AI 负载越高 —— 这是掉 TICK 的直接来源。
//  把波次拆小，等于把同样的总量摊到更多帧上，是治"一秒灌入"的第一道闸。
l4d2_mob_spawn_min_size "40"        // 人数 <= 4 时，一次尸潮最少刷几只
l4d2_mob_spawn_max_size "80"        // 人数 <= 4 时，一次尸潮最多刷几只
l4d2_mob_spawn_min_size_step "4"    // ★必须整数：插件用 IntValue 读，小数会被截断
l4d2_mob_spawn_max_size_step "4"    // ★必须整数：同上
l4d2_mob_spawn_min_size_min "40"    // ★硬下限
l4d2_mob_spawn_min_size_max "80"    // ★硬上限
l4d2_mob_spawn_max_size_min "60"    // ★硬下限
l4d2_mob_spawn_max_size_max "100"   // ★硬上限


// ----------------------------------------------------------------------------
//  三、【常规小僵尸上限】 → z_common_limit
// ----------------------------------------------------------------------------
//  ⚠️ 机制：这个值按人数缩放，实测效果接近于 0 —— 因为引擎从来填不满它
//     （"贴顶率"在所有人数下都是 0%）。真正让地图变热闹的是游荡密度。
//     留着它是为了兜底：万一游荡密度调高后人口真的涨上来，得有个闸门。
l4d2_common_limit "64"              // 人数 <= 4 时
l4d2_common_limit_step "16"         // 每多一人 +16
l4d2_common_limit_min "32"          // ★硬下限
l4d2_common_limit_max "256"         // ★硬上限


// ----------------------------------------------------------------------------
//  四、【警报 / 大尸潮】 → z_mega_mob_size
// ----------------------------------------------------------------------------
//  ⚠️ 机制：警报尸潮允许**短期突破**常规上限再压回来，所以即使 4 人时
//     存活上限只有几十，写 40 照样能刷出 40~60 只。
//     引擎会在这个写入值附近浮动（写 40 → 实际刷 40~60；写 60 → 实际刷 60~80）。
//  ⇒ 普通尸潮保持克制、只有警报给足，这样"警报"才有稀有感和震撼感。
l4d2_mega_mob_size "40"             // 人数 <= 4 时（引擎在此值附近浮动 40~60）
l4d2_mega_mob_size_step "5"         // 每多一人 +5
l4d2_mega_mob_size_min "60"         // ★硬下限
l4d2_mega_mob_size_max "100"        // ★硬上限


// ----------------------------------------------------------------------------
//  五、★★★【游荡密度】 l4d2_wandering_density → z_wandering_density
// ----------------------------------------------------------------------------
//  真正决定"地图空不空"的那个值：控制散在地图上、不追人的那批小僵尸的密度。
//  原版默认 0.03（几乎等于没有）。
//
//  ⚠️ 光改这个值是空转的 —— server.cfg 必须先有这一行：
//        sm_cvar director_always_allow_wanderers 1
//     没有它，游荡僵尸永远不会被允许生成，密度填多大都一样。
l4d2_wandering_density "0.25"           // 人数 <= 4 时的密度系数
l4d2_wandering_density_step "0.0167"    // 每多一人 +0.0167（浮点，允许小数）
l4d2_wandering_density_min "0.03"       // ★硬下限（= 原版值）
l4d2_wandering_density_max "0.35"       // ★硬上限
//  8 人房还是空 → 把 _step 加大；太挤 / 掉 tick → 把 _step 或 _max 收小。


// ----------------------------------------------------------------------------
//  六、【后台小僵尸上限】 l4d2_background_limit → z_background_limit
// ----------------------------------------------------------------------------
//  引擎原文："How many common infected are on the background map at once"
//  后台地图 = 玩家还没走到、不在视野内的那部分。
//  调高它，玩家走过去时就不会有"僵尸凭空冒出来"的突兀感 ——
//  因为它们在后台就已经站在那里了。原版默认 20。
l4d2_background_limit "320"             // 人数 <= 4 时
l4d2_background_limit_step "40"         // 每多一人 +40
l4d2_background_limit_min "200"         // ★硬下限
l4d2_background_limit_max "480"         // ★硬上限


// ----------------------------------------------------------------------------
//  七、★★【分布散布控制】治"走廊空着、全挤在一个小屋子里"
// ----------------------------------------------------------------------------
//  扎堆的根因是"1 秒内一次性灌入"：同样一批僵尸，缓释到几秒生成会明显摊开。
//  下面三个引擎值都按人数在 [_min, _max] 之间**线性插值**，逼导演去更远、
//  更散的位置挑刷新点：
//    z_density_region_length  评估"这片区域够不够密"时看多长一段路。
//                             调大 ⇒ 不会在同一个点上反复堆。
//    z_spawn_safety_range     生成点离玩家至少多远。调大 ⇒ 不会在脸上堆。
//    z_spawn_range            找刷点的搜索半径。调大 ⇒ 能挑到更远的点。
//  ⚠️ 这三个值故意调得保守：放得太大可能让刷点跑到地图外边或不可达区域
//     （僵尸卡墙里）。建议先跑一轮，看日志里 maxbin 有没有降、bins 有没有升，
//     再决定要不要继续加。
l4d2_spread_region_min "1500"           // 4 人及以下 = 原版值（1500）
l4d2_spread_region_max "2750"           // 8 人及以上 = 2.1 倍
l4d2_spread_safety_min "500"            // 4 人及以下 ≈ 原版值（550）
l4d2_spread_safety_max "800"            // 8 人及以上 = 1.6 倍
l4d2_spread_range_min "1250"            // 4 人及以下 ≈ 原版值（1500）
l4d2_spread_range_max "2500"            // 8 人及以上 = 1.7 倍
l4d2_spread_low_players "4"             // <= 此人数用 _min 值
l4d2_spread_high_players "8"            // >= 此人数用 _max 值
l4d2_spread_off "0"                     // 1 = 完全不碰上面三个引擎 cvar（排查用）


// ----------------------------------------------------------------------------
//  八、【全局绝对天花板】 l4d2_ai_max_zombie
// ----------------------------------------------------------------------------
//  上面所有参数算完之后，都不会超过这个数。0 = 不限制。
//  ⚠️ 它只夹【四个整数参数】（上限 / 尸潮 / 警报），
//     **不夹**游荡密度和后台上限（那两个是引擎自己的配额）。
l4d2_ai_max_zombie "256"                // 全局绝对天花板


// ----------------------------------------------------------------------------
//  九、【尸潮脉动上限 · 空位】
// ----------------------------------------------------------------------------
//  机制：地图平时就顶满上限 ⇒ 尸潮触发时没有落脚空间（一只都塞不进去）。
//        解法是在尸潮那一刻把 z_common_limit 临时打开，事后收回。
//  空位 = base + （人数 - 起始人数）× step，再夹 _max。
//  ⚠️ 空位**故意绕过** l4d2_ai_max_zombie 的全局钳制
//     （那个上限是防呆用的，脉动就是要突破它），改用 _cap_max 单独保护 tick。
l4d2_pulse_enable "1"                   // 脉动总开关
l4d2_pulse_mode "1"                     // 1 = 尸潮定时器驱动（与导演尸潮同步）
                                        // 2 = 锯齿波（无条件周期开，能覆盖地图机关 / 救援关）
l4d2_pulse_extra "20"                   // ★空位基础值（4 人及以下给多少）
                                        //   **不要写 0**：0 = 自动模式 = max(尸潮上限, 警报上限)，会过大
l4d2_pulse_extra_step "5"               // ★每多一人空位 +5 ⇒ 8 人 = 20 + 4×5 = 40
l4d2_pulse_extra_max "40"               // ★空位硬上限（不论多少人都不超过它）
l4d2_pulse_cap_max "180"                // ★★抬完之后的上限绝不超过 180 —— 保 tick 最后一道闸
l4d2_pulse_lead "1.5"                   // 尸潮倒计时剩这么多秒时提前开口子
l4d2_pulse_hold "8.0"                   // 触发后保持多少秒（**别超 10 秒**，否则不成其为脉动）
l4d2_pulse_finale_bonus "60"            // 救援关额外再加多少（会被 _cap_max 钳到 180）
l4d2_pulse_debug "1"                    // 0 = 安静 / 1 = 写日志 / 2 = 同时聊天框提示


// ----------------------------------------------------------------------------
//  十、调参命令（服务器控制台 / 管理员）
// ----------------------------------------------------------------------------
//   sm_zstat     战场视角：存活小僵尸 / 峰值 / 特感 / Witch / Tank / 距下次尸潮秒数 /
//                分布 bins-maxbin-span / 游荡密度 / 后台上限 / 散布三值 / 周期校正是否在跑
//   sm_zombies   配置视角：每个参数的 实算 / 原始 / 夹取区间 / 引擎现值
//
//  判读法：
//     · 存活数一直贴着上限    → 上限是瓶颈
//     · 存活数离上限很远      → 上限没卡住，问题在游荡密度
//     · bins 少、maxbin 大    → 扎堆，加大 l4d2_spread_region_max
//     · 日志里出现"一秒几十只" → 一次灌入，加大 _step 或调小 mob 波次
// ============================================================================
