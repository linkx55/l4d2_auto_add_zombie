// ============================================================================
//  l4d2_auto_add_zombie.cfg
//  Dynamic zombie counts / hard clamps / wanderer density / spawn spreading
//  Reload plugin:    sm plugins reload l4d2_auto_add_zombie
//  v1.8.2  |  GNU GPL v3  |  derived from "动态僵尸. v1.0.1" by Tom.
// ----------------------------------------------------------------------------
//  The following 8 entries come from the original plugin and keep their original
//  semantics and defaults, so an existing v1.0.1 cfg still works unchanged:
//      ai_enabled_zombie / ai_playercount_zombie / l4d2_ai_auto_add_zombie /
//      l4d2_ai_max_zombie / l4d2_common_limit / l4d2_mega_mob_size /
//      l4d2_mob_spawn_min_size / l4d2_mob_spawn_max_size
//  All other l4d2_* entries were added by this build.
// ----------------------------------------------------------------------------
//  WARNING: this file runs AFTER server.cfg, so it OVERRIDES same-named
//           settings there. To hand a parameter back to server.cfg: set its
//           _step to 0 and change the base value to the fixed number you want.
//  WARNING: the plugin auto-executes this file (AutoExecConfig name =
//           l4d2_auto_add_zombie). The filename MUST match that name,
//           or none of these values get loaded at all.
//
//  General rule (every parameter except the master switches is a four-part
//  ladder):
//      computed = base + (players - start_players) * step
//      final    = clamp(computed, _min, _max)
//      start_players = ai_playercount_zombie (default 4)
//  !! Any _max below that parameter's highest ladder value silently flattens the
//     whole ladder -- the single most common tuning mistake.
// ============================================================================


// ----------------------------------------------------------------------------
//  1. Master switches
// ----------------------------------------------------------------------------
plugin_enable "1"                   // master switch: 0 = never touch any engine cvar
plugin_hint "0"                     // 1 = chat message on value change, 0 = silent
ai_enabled_zombie "1"               // 0 = all params fixed, 1 = dynamic by player count
ai_playercount_zombie "4"           // start players: bonus only kicks in above this count
l4d2_ai_count_bots "1"              // 1 = count bots as players, 0 = real players only
l4d2_ai_apply_interval "1"          // periodic correction interval (sec), 0 = off
l4d2_ai_force_trim "0"              // 1 = hard-delete live commons above the hard cap (last resort)
l4d2_ai_test_players "0"            // debug: simulate N players, 0 = use the real count

// Heartbeat log: periodically writes battlefield data to
// left4dead2/l4d2_zombie_watch.log (the game root, NOT addons/sourcemod/logs/)
l4d2_ai_log_enable "1"              // 1 = write the log, 0 = off (zero overhead when off)
l4d2_ai_log_interval "1.0"          // heartbeat interval (sec); 1.0 is needed to see horde spawn rate
l4d2_ai_tick_warn "55"              // write an extra TICKWARN line below this tick rate, 0 = off


// ----------------------------------------------------------------------------
//  2. [Horde wave size] -> z_mob_spawn_min_size / z_mob_spawn_max_size
// ----------------------------------------------------------------------------
//  The bigger the single dump, the higher the per-frame AI load -- this is the
//  direct cause of tick drops. Smaller waves spread the same total over more
//  frames, which is the first gate against a "one-second dump".
l4d2_mob_spawn_min_size "40"        // at players <= 4: minimum spawned per horde
l4d2_mob_spawn_max_size "80"        // at players <= 4: maximum spawned per horde
l4d2_mob_spawn_min_size_step "4"    // MUST be an integer: plugin reads IntValue, decimals get truncated
l4d2_mob_spawn_max_size_step "4"    // MUST be an integer: same reason
l4d2_mob_spawn_min_size_min "40"    // hard floor
l4d2_mob_spawn_min_size_max "80"    // hard ceiling
l4d2_mob_spawn_max_size_min "60"    // hard floor
l4d2_mob_spawn_max_size_max "100"   // hard ceiling


// ----------------------------------------------------------------------------
//  3. [Regular common cap] -> z_common_limit
// ----------------------------------------------------------------------------
//  !! MECHANISM: scaling this with player count has a measured effect of almost
//     zero, because the engine never fills it (the "at-cap ratio" is 0% at every
//     player count). What makes a map feel busy is wanderer density.
//     It is kept purely as a safety gate in case population really does rise
//     after raising wanderer density.
l4d2_common_limit "64"              // at players <= 4
l4d2_common_limit_step "16"         // +16 per extra player
l4d2_common_limit_min "32"          // hard floor
l4d2_common_limit_max "256"         // hard ceiling


// ----------------------------------------------------------------------------
//  4. [Alert / mega horde] -> z_mega_mob_size
// ----------------------------------------------------------------------------
//  !! MECHANISM: an alert horde is allowed to briefly BREACH the regular cap and
//     then squeeze back down. So even when the alive cap at 4 players is only a
//     few dozen, writing 40 still spawns 40~60.
//     The engine rolls around the written value (writes 40 -> spawns 40~60;
//     writes 60 -> spawns 60~80).
//  => Keep normal hordes restrained and give only alerts the full budget: that
//     is what makes an alert feel rare and spectacular.
l4d2_mega_mob_size "40"             // at players <= 4 (engine rolls 40~60 around it)
l4d2_mega_mob_size_step "5"         // +5 per extra player
l4d2_mega_mob_size_min "60"         // hard floor
l4d2_mega_mob_size_max "100"        // hard ceiling


// ----------------------------------------------------------------------------
//  5. *** [Wanderer density] l4d2_wandering_density -> z_wandering_density
// ----------------------------------------------------------------------------
//  The value that actually decides whether the map feels empty: it controls the
//  density of the commons that wander the map without chasing anyone.
//  Vanilla default 0.03 (almost nothing).
//
//  !! Changing only this value is a NO-OP. server.cfg must contain:
//        sm_cvar director_always_allow_wanderers 1
//     Without it, wanderers are never allowed to spawn and the density value is
//     irrelevant.
l4d2_wandering_density "0.25"           // density coefficient at players <= 4
l4d2_wandering_density_step "0.0167"    // +0.0167 per extra player (float, decimals allowed)
l4d2_wandering_density_min "0.03"       // hard floor (= vanilla value)
l4d2_wandering_density_max "0.35"       // hard ceiling
//  8-player room still empty -> raise _step; too crowded / tick drops -> lower _step or _max.


// ----------------------------------------------------------------------------
//  6. [Background common limit] l4d2_background_limit -> z_background_limit
// ----------------------------------------------------------------------------
//  Engine description: "How many common infected are on the background map at
//  once". The background map = the part the players have not reached and cannot
//  see yet.
//  Raising it means players do not get that jarring "zombies materialized out
//  of thin air" feel when they walk there -- the commons were already standing
//  in the background. Vanilla default 20.
l4d2_background_limit "320"             // at players <= 4
l4d2_background_limit_step "40"         // +40 per extra player
l4d2_background_limit_min "200"         // hard floor
l4d2_background_limit_max "480"         // hard ceiling


// ----------------------------------------------------------------------------
//  7. ** [Spawn spreading] fixes "corridor empty, everyone crammed in one room"
// ----------------------------------------------------------------------------
//  Clumping is caused by a one-second dump: the same batch of commons spreads
//  out noticeably when released over several seconds.
//  All three engine values below are LINEARLY INTERPOLATED between [_min, _max]
//  by player count, forcing the Director to pick farther, more spread points:
//    z_density_region_length  how long a stretch of path is evaluated for
//                             "is this area dense enough". Raising it stops the
//                             engine piling onto the same spot.
//    z_spawn_safety_range     minimum distance from players to a spawn point.
//                             Raising it stops spawning right in your face.
//    z_spawn_range            search radius for spawn points. Raising it lets it
//                             pick points farther out.
//  !! These are deliberately conservative: pushing too far can put spawn points
//     outside the map or in unreachable areas (zombies stuck in walls). Run one
//     round first and check whether maxbin dropped and bins rose in the log.
l4d2_spread_region_min "1500"           // 4 players and below = vanilla (1500)
l4d2_spread_region_max "2750"           // 8 players and above = 2.1x
l4d2_spread_safety_min "500"            // 4 players and below = near vanilla (550)
l4d2_spread_safety_max "800"            // 8 players and above = 1.6x
l4d2_spread_range_min "1250"            // 4 players and below = near vanilla (1500)
l4d2_spread_range_max "2500"            // 8 players and above = 1.7x
l4d2_spread_low_players "4"             // <= this count uses the _min value
l4d2_spread_high_players "8"            // >= this count uses the _max value
l4d2_spread_off "0"                     // 1 = never touch the three engine cvars above (for A/B isolation)


// ----------------------------------------------------------------------------
//  8. [Global absolute ceiling] l4d2_ai_max_zombie
// ----------------------------------------------------------------------------
//  Nothing computed above may exceed this number. 0 = no limit.
//  !! It only clamps the FOUR INTEGER parameters (cap / mob / mega). It does NOT
//     clamp wanderer density or the background limit (those are the engine's own
//     quotas).
l4d2_ai_max_zombie "256"                // global absolute ceiling


// ----------------------------------------------------------------------------
//  9. [Horde pulse cap - headroom]
// ----------------------------------------------------------------------------
//  MECHANISM: the map sits at the cap all the time, so when a horde fires there
//            is no room to land (not a single common fits). The fix is to open
//            z_common_limit right at the horde and close it again afterwards.
//  headroom = base + (players - start_players) * step, then clamped to _max.
//  !! The headroom deliberately BYPASSES the l4d2_ai_max_zombie global clamp
//     (that ceiling is a safety net; the pulse exists precisely to breach it).
//     _cap_max protects the tick instead.
l4d2_pulse_enable "1"                   // master switch for the pulse
l4d2_pulse_mode "1"                     // 1 = driven by the horde timer (syncs with the Director)
                                        // 2 = sawtooth (unconditional periodic openings; also covers map scripts / finales)
l4d2_pulse_extra "20"                   // headroom base value (what 4 players and below get)
                                        //   !! DO NOT SET 0: 0 = auto = max(mob cap, mega cap), far too large
l4d2_pulse_extra_step "5"               // +5 headroom per extra player => 8 players = 20 + 4*5 = 40
l4d2_pulse_extra_max "40"               // headroom hard ceiling (never exceeded regardless of player count)
l4d2_pulse_cap_max "180"                // the raised cap never exceeds 180 -- the final tick safety gate
l4d2_pulse_lead "1.5"                   // open the headroom this many seconds before the horde fires
l4d2_pulse_hold "8.0"                   // hold it open this many seconds (do NOT exceed 10, or it stops being a pulse)
l4d2_pulse_finale_bonus "60"            // extra headroom on finale maps (clamped to 180 by _cap_max)
l4d2_pulse_debug "1"                    // 0 = silent / 1 = log / 2 = also print to chat


// ----------------------------------------------------------------------------
//  10. Tuning commands (server console / admin)
// ----------------------------------------------------------------------------
//   sm_zstat     battlefield view: live commons / peak / SI / witch / tank /
//                seconds to next horde / spread bins-maxbin-span / wanderer
//                density / background limit / the three spread values /
//                whether periodic correction is running
//   sm_zombies   config view: for every parameter, computed / raw / clamp range /
//                current engine value
//
//  How to read:
//     - alive count pinned at the cap     -> the cap is the bottleneck
//     - alive count far from the cap      -> cap is not the issue, wanderer density is
//     - low bins, high maxbin             -> clumping, raise l4d2_spread_region_max
//     - log shows "dozens in one second"  -> one-second dump, raise _step or lower the mob wave size
// ============================================================================
