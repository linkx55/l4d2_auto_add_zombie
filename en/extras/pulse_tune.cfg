// ============================================================================
// pulse_tune.cfg -- [horde pulse cap] headroom scaled by player count + hard cap
// ----------------------------------------------------------------------------
// Purpose: temporarily set the pulse headroom to "scale with player count"
//          without editing the main cfg.
//          Requires v1.8.1+ of the .smx (which added l4d2_pulse_extra_step and
//          l4d2_pulse_extra_max). On an older .smx the first lines will report
//          "Unknown command".
//
// [WHY HEADROOM MUST NOT BE 0]
//   headroom = 0 means "auto" = max(mob cap, mega cap). At higher player counts
//   that value gets large:
//     e.g. mob cap 96, mega cap 60 => headroom 96 => at 8 players the cap is
//     raised to 128+96 = 224, and the peak easily passes 220 => tick drops on a
//     single core.
//   => Scale it by player count instead: 8 players get only 40 => cap 168.
//
// [USAGE]
//   1) Hot-load (no restart): exec pulse_tune.cfg
//   2) To persist: paste the lines below into
//      cfg/sourcemod/l4d2_auto_add_zombie.cfg
//   3) To revert: set _step and _max back to 0
//      (_step 0 = fixed headroom, no scaling)
// ============================================================================

sm_cvar l4d2_pulse_extra 20          // headroom base: 4 players and below = +20
sm_cvar l4d2_pulse_extra_step 5      // +5 per extra player => 8 players = 20 + 4*5 = 40
sm_cvar l4d2_pulse_extra_max 40      // headroom hard ceiling (never above +40)
sm_cvar l4d2_pulse_cap_max 180       // absolute ceiling of the raised cap (final tick safety gate)

echo "=========================================================="
echo " pulse: headroom 4p+20 / 8p+40 / cap+40 ; ceiling 180"
echo " 8 players -> base 128 + 40 = 168"
echo "=========================================================="


// ============================================================================
// [RESULT TABLE] (base cap comes from the l4d2_common_limit ladder in the main cfg)
//   players | base cap | headroom | pulsed cap
//   --------+----------+----------+------------
//      4    |    64    |   +20    |     84
//      5    |    80    |   +25    |    105
//      6    |    96    |   +30    |    126
//      7    |   112    |   +35    |    147
//      8    |   128    |   +40    |    168
//      9    |   144    |   +40*   | 184 -> 180
//     10    |   160    |   +40*   | 200 -> 180
//   --------+----------+----------+------------
//   * capped by l4d2_pulse_extra_max 40; from 9 players on, clamped to 180 by cap_max
// ============================================================================


// ============================================================================
// [IF 168 STILL DROPS TICK] tighten in this order, one change at a time:
//   sm_cvar l4d2_pulse_cap_max 150     squeeze the global ceiling to 150
//   sm_cvar l4d2_pulse_extra_max 30    tighten headroom further
//   sm_cvar l4d2_pulse_extra 15        tighten base headroom
//   !! Do NOT fall back to "auto" (l4d2_pulse_extra 0) -- that yields a huge headroom.
//
// [COMPLEMENTARY PATH] This file lowers "simultaneous alive count" (the first
//   multiplier in the formula); perf_nextbot.cfg lowers "per-zombie AI cost"
//   (the second). They stack.
// ============================================================================
