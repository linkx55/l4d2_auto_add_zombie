// ============================================================================
// wandering_fix.cfg -- restore the wanderer parameters that decide map density
// ----------------------------------------------------------------------------
// Purpose: set the two engine cvars that really decide "are there wandering
//          commons on the map" to sensible values.
//
// [MECHANISM: why these two values matter]
//   Raising z_common_limit does NOT add zombies -- the engine never fills it.
//   What actually decides population is the wanderer system:
//       z_wandering_density   density coefficient of wandering commons.
//                             Vanilla default 0.03 (almost nothing).
//       z_background_limit    quota for the background map (the part players have
//                             not reached and cannot see yet).
//                             Vanilla default 20.
//   !! Prerequisite: server.cfg must contain
//        sm_cvar director_always_allow_wanderers 1
//      Without it, wanderers are never allowed to spawn and the density value is
//      irrelevant.
//   !! Higher z_background_limit => more background AI => more CPU.
//      The values below are "restore to sensible", not "max out". Watch the tick
//      before going higher.
//
// [!! ABOUT z_spawn_range]
//   Writing to this cvar has been proven to have NO EFFECT (it always reads back
//   1500). So it is deliberately omitted below -- writing it would only mislead.
//   Use `z_acquire_far_range` if you want longer sight range (that one works).
//
// [USAGE] hot-loadable, no restart:
//   exec wandering_fix.cfg      apply
//   exec wandering_fix_off.cfg  back to engine defaults
// ============================================================================


// ---- Option 1 (recommended): gentle restore ----
sm_cvar z_wandering_density 0.25    // vanilla 0.03 -> 0.25 (~8x)
sm_cvar z_background_limit 240      // vanilla 20 -> 240 (conservative; verify the tick first)
// Expect: wide open maps should clearly have "zombies everywhere"; the tick will
//         rise (more AI), so watch TICKWARN.


// ---- Option 2 (full restore): raise the background quota too ----
// Use if Option 1's tick is fine and you want more. 400 background zombies all
// running AI is real load.
//sm_cvar z_wandering_density 0.25
//sm_cvar z_background_limit 400


// ---- Option 3 (static stand-in for dynamic scaling): tuned for 8 players ----
// This is a static cfg and cannot scale with player count. For that, use the
// plugin's l4d2_wandering_density_step / l4d2_background_limit_step instead.
// If you only want one fixed value covering your usual player count (8), use:
//sm_cvar z_wandering_density 0.41
//sm_cvar z_background_limit 360


// ============================================================================
// [HOW TO CONFIRM IT TOOK EFFECT]
//   Console: sm_cvar z_wandering_density   should echo 0.25 (or your value)
//            sm_cvar z_background_limit    should echo 240
//   !! If it still reads 0.03 / 20, a plugin cfg is overriding it (SourceMod
//      cfgs run AFTER server.cfg).
//   In game: on open maps (plazas / outdoors) you should clearly see commons
//            standing around idly.
// ============================================================================
