// ============================================================================
// wandering_fix_off.cfg -- restore the wanderer parameters to engine defaults
// ----------------------------------------------------------------------------
// Purpose: revert after running wandering_fix.cfg, back to the vanilla
//          defaults (0.03 / 20).
// ============================================================================

sm_cvar z_wandering_density 0.03    // vanilla default
sm_cvar z_background_limit 20       // vanilla default

echo "=========================================="
echo " wandering_fix off -> 0.03 / 20 (vanilla)"
echo "=========================================="
