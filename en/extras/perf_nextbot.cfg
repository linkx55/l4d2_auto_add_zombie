// ============================================================================
// perf_nextbot.cfg   -- mitigates "tick drops during hordes"
// ----------------------------------------------------------------------------
// For 64-tick servers, used alongside l4d2_auto_add_zombie.
// Hot-loadable -- no restart required.
//
// [DIAGNOSIS]
//   Symptom: tick drops when a map event fires (alert horde), and recovers the
//            instant the horde ends.
//   * "recovers the instant it stops" is the key evidence: the cause is NOT a
//     one-off spawn spike (that would clear in 1-2 s), but the SUSTAINED high AI
//     load during the horde.
//
//   Formula: CPU per tick  ~=  alive (simultaneous commons) x per-zombie AI cost
//            During a horde both multipliers rise at once => ~4x cost => tick drops
//              . alive         ~60 normally -> ~120-140 during a horde
//                              (an alert can breach the regular cap)
//              . per-zombie    all of them enter "locked onto a survivor" state:
//                              pathfinding + perception + victim selection all run
//            => When the horde ends, both multipliers fall together, so it
//               recovers immediately. This matches the symptom exactly.
//
// [THE THREE CVARS]
//   NextBots = common infected + special infected + witch + survivor bots
//              (everything that is AI but not a player)
//
//   1) nb_update_frequency   UNIT = SECONDS. Artificial delay between AI updates.
//         0 = every tick | 0.0226 ~= 44/s | 0.1 = 10/s | 0.2 = 5/s
//         !! Official default = 0; the widely repeated "default 0.1" is a myth.
//         !! Does NOT affect zombie count / spawning / respawn rate, only how
//            fast they "think".
//
//   2) nb_update_framelimit  UNIT = zombies per frame. How many NextBots get
//                            their AI processed each frame (default 15).
//         * The core throttle of this file: it decouples "cost per frame" from
//           "total zombie count". Lowering it means: whether 60 or 200 are on
//           the field, only N are computed per frame.
//
//   3) nb_update_maxslide    UNIT = ticks. Force an update after being deferred
//                            this many ticks (default 2).
//         * Higher = more queuing allowed = fewer forced jumps = LOWER CPU
//         !! Easy to get backwards: competitive configs use a small maxslide
//            with a very low frequency, because they want maximum
//            responsiveness and are willing to burn CPU. To SAVE CPU you must
//            RAISE it.
// ============================================================================


// ---- Preset A (try first): safe ----
// Idea: slightly relax the frequency, strengthen the per-frame throttle, allow
// queuing. Very little change in feel.
sm_cvar nb_update_frequency 0.125   // 10/s -> 8/s
sm_cvar nb_update_framelimit 8      // 15 -> 8 per frame (-47%)  * core knob
sm_cvar nb_update_maxslide 3        // allow 3 ticks of queuing (default 2) * higher = cheaper
// Expect: clearly better tick during hordes; feel essentially unchanged;
//         zombie count completely unchanged.


// ---- Preset B (stronger): switch to this if A is not enough ----
// Cost: distant zombies feel noticeably slower, but close-range perception is
// still normal.
// To switch: comment out the three Preset A lines above, uncomment the three
// below, then exec.
//sm_cvar nb_update_frequency 0.15    // 6.7/s
//sm_cvar nb_update_framelimit 5      // only 5 per frame  * strong throttle
//sm_cvar nb_update_maxslide 5        // allow 5 ticks of queuing


// ---- Preset C (extreme): only if B is still not enough and you accept
//      zombies "standing around" ----
//sm_cvar nb_update_frequency 0.2     // 5/s
//sm_cvar nb_update_framelimit 3      // only 3 per frame
//sm_cvar nb_update_maxslide 6

// !! Do not push frequency past 0.2 -- beyond that, zombies visibly hesitate
//    for about half a second before reacting to a player.


// ============================================================================
// [MECHANISM: the engine's native batched spawning]
// ----------------------------------------------------------------------------
//  Valve's official scripting docs, verbatim:
//    "A Panic lasts until MegaMobSize commons spawn, and **no more than
//     CommonLimit will ever be out at once**. So MegaMobSize 50 CommonLimit 2
//     is a long slow gentle PANIC, and MegaMobSize 80 CommonLimit 80 is over
//     instantly, with a lot of zombies around."
//
//  => The engine natively supports batching. Dump speed = MegaMobSize : CommonLimit
//       MegaMobSize = how many to release in total this panic
//       CommonLimit = how many may be out at the same time (sets the pace)
//  => If CommonLimit >= MegaMobSize the whole horde dumps instantly => tick spike.
//     To stretch it out, keep CommonLimit low during the horde: same total,
//     released over several seconds.
//    !! Counter-intuitive but correct: LOWERING CommonLimit makes the horde
//       slower and the tick MORE stable.
//    !! Note the plugin's "horde pulse cap" goes the opposite way (raises the
//       cap just before a horde) so the horde can actually get in. Different
//       goals: pulse = keep it spectacular; batching = keep the tick stable.
// ============================================================================


// ============================================================================
// [HOW TO VERIFY]
//   Install Preset A, play a round, trigger one alert horde:
//     1) Tick no longer drops -> confirmed it was sustained AI cost; this file
//        is the right fix.
//     2) Tick still drops -> the cause is a spawn spike (one-off entity creation
//        + snapshot packing); you need to change the counts.
//
//   Evidence: the log at <server>/left4dead2/l4d2_zombie_watch.log
//             search for TICKWARN (records the tick rate and alive count then)
// ============================================================================


// ============================================================================
// [FALLBACK: if nb_* cannot hold it down, you must change the counts]
//   Lower the alert horde size (in cfg/sourcemod/l4d2_auto_add_zombie.cfg):
//       l4d2_mega_mob_size      "40"  -> write "20" to halve it
//       l4d2_mega_mob_size_min  "60"  -> hard floor, it will clamp base back up!
//                                        to really lower it you MUST lower this
//                                        to 20 or 0 at the same time
//       l4d2_mega_mob_size_max  "100" -> likewise, lower it to 60
//     !! Changing only base without _min does nothing -- base 40 gets clamped
//        back up to _min 60.
// ============================================================================


// ============================================================================
// [sv_parallel_* ] -- DO NOT TOUCH
//   sv_parallel_packentities 0 / sv_parallel_sendsnapshot 0
//   are official Valve anti-crash measures (the parallel path has a thread-lock
//   bug when frames drop). Keep them at 0.
//   !! But they also amplify spawn spikes: when a horde creates N entities at
//      once, entity packing + snapshot sending all pile onto one core.
// ============================================================================


// ============================================================================
// [USAGE] (hot-loadable, no restart)
//   exec perf_nextbot.cfg       apply
//   exec perf_nextbot_off.cfg   revert
//   To persist across restarts, add this line at the end of server.cfg:
//       exec perf_nextbot.cfg
//      !! Values set by hand in the console are LOST on restart; only that line
//         makes them stick.
// ============================================================================
