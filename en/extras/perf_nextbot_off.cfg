// ============================================================================
// perf_nextbot_off.cfg -- restore nb_* to their defaults
// ----------------------------------------------------------------------------
// Purpose: revert after running perf_nextbot.cfg (no restart needed).
//
// !! The engine default for nb_update_frequency is 0, but map scripts rewrite it
//    at runtime, so this restores 0.1 / 15 / 2 uniformly (the latter two being
//    the official defaults for framelimit and maxslide).
// ============================================================================

sm_cvar nb_update_frequency 0.1     // 10 per second
sm_cvar nb_update_framelimit 15     // official default
sm_cvar nb_update_maxslide 2        // official default

echo "=========================================="
echo " perf_nextbot off -> nb_* = 0.1 / 15 / 2"
echo "=========================================="
